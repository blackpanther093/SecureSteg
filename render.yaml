services:
  - type: web
    name: securesteg-backend
    runtime: python
    region: oregon
    plan: starter
    
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT app.main:app
    
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://secure-steg.onrender.com,http://localhost:5173
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8000"
    
    routes:
      - path: /
        matchType: prefix
        service: securesteg-backend

  - type: static_site
    name: securesteg-frontend
    runtime: static
    region: oregon
    
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    
    envVars:
      - key: VITE_API_URL
        value: https://securesteg.onrender.com
    
    routes:
      - path: /
        matchType: prefix
